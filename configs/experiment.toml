# Experiment configuration. Paths point outside the repo (see vault/06-Environment-Setup.md).

[paths]
chsd_rgb = 'D:\heritage3d-data\chsd\rgb\CHSDD_RGB'
chsd_depth = 'D:\heritage3d-data\chsd\depth\CHSDD_depth'
runs = 'D:\heritage3d-data\runs'

[dataset]
# Camera rings (elevations in degrees); verified on the files 2026-10-29.
rings = [-90, -45, 0, 45, 90]
# Azimuth sampling of the rendered views, in degrees: 360 frames per ring (verified).
azimuth_step = 1
# Rings whose views do not change with azimuth (pure top/bottom views). Each contributes
# one image per level. Verified 2026-10-29: +/-90 views are the same picture spun in-plane.
pole_rings = [-90, 90]
# Image file patterns relative to chsd_rgb / chsd_depth.
# Fields: {artifact}, {elevation}, {azimuth}, {frame} (1-based file number = azimuth / azimuth_step + 1).
rgb_pattern = '{artifact}/RGB/{frame:04d}_{elevation}_.png'
depth_pattern = '{artifact}/Z/{frame:04d}_{elevation}_.png'

# Reconstruction settings: identical for every level and artifact.
[pipeline]
# Renders have square pixels and no lens distortion -> focal length + principal point only.
camera_model = 'SIMPLE_PINHOLE'
# All five Blender cameras assumed to share one lens (hypothesis; check reprojection error).
single_camera = true
# exhaustive_matcher compares every image pair; fine up to a few hundred images. Fixed after the pilot.
matcher = 'exhaustive_matcher'
# OpenMVS DensifyPointCloud: 0 = full resolution, 1 = half (default); never below 640 px.
densify_resolution_level = 1

# Evaluation against the CHSD reference cloud (decoded depth, see src/heritage3d/reference.py).
# All lengths are in units of R, the camera-to-centre distance.
[evaluation]
# Reference built from every CHSD view (all 1,800), every 2nd pixel, merged on this voxel grid.
reference_stride = 2
voxel = 0.002
# Distance thresholds for precision / recall / F-score.
thresholds = [0.002, 0.005, 0.01]

# Image-input levels: azimuth step in degrees, applied uniformly on every ring.
[levels]
L1 = 3
L2 = 6
L3 = 12
L4 = 24
L5 = 45
